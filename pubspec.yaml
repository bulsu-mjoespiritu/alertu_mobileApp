flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - images/
    - images/navbaricons/
    - images/markericons/fireicon.png
    - images/markericons/floodicon.png
    - images/markericons/accicon.png
    - images/markericons/caricon.png
    - images/markericons/quakeicon.png
    - images/markericons/warnicon.png
    - images/markerlegends/firemap.png
    - images/markerlegends/accmap.png
    - images/markerlegends/warnmap.png
    - images/markerlegends/floodmap.png
    - images/markerlegends/maplegicon.png
    - images/missedcallring.mp3
    - images/callringtone.mp3
    - images/messagetone.mp3
    - images/background.png
    - images/googleicon.png
    - images/logo1.png
    - images/clicksound.mp3
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

flutter_native_splash:
  color: "#FFFFFF"
  image: images/logo1.png

  color_dark: "#121212"
  image_dark: images/logo1.png

  android_12:
    image: images/logo1.png

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "images/logo1.png"
  min_sdk_android: 21
  adaptive_icon_monochrome: "images/logo1.png"

