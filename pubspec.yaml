  get: ^4.7.3
  google_sign_in: ^7.2.0
  intl_phone_field: ^3.2.0
  permission_handler: ^12.0.3
  flutter_map: ^8.3.0
  geolocator: ^14.0.3
  location: ^8.0.1
  flutter_svg: ^2.3.0
  camerawesome: ^2.5.0
  cloud_firestore: ^6.6.0
  http: ^1.6.0
  path_provider: ^2.1.6
  record: ^7.1.0
  video_player: ^2.11.1
  url_launcher: ^6.3.2
  nsd: ^5.0.1
  location_picker_flutter_map: ^4.1.0
